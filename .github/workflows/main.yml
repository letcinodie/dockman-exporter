name: Docker Image CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container: golang:1.24.6
    steps:
    - uses: actions/checkout@v5
    - run: go build -o build/dockman-exporter src/dockman-exporter.go
    - uses: actions/upload-artifact@v4
      with:
        name: dockman-exporter
        path: build/dockman-exporter
        retention-days: 1
  
  build_container_image:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v5
        with:
          name: dockman-exporter
          path: build/dockman-exporter
      - name: Buildah action
        uses: redhat-actions/buildah-build@v2
        with:
          image: dockman-exporter
          tags: latest ${{ github.head_ref || github.ref_name }}
          containerfiles: Dockerfile
      - name: Login to Dockerhub Container Registry
        uses: docker/login-action@v3
        with:
          registry: index.docker.io
          #username: ${{ github.actor }}
          username: iamcino
          password: ${{ secrets.DOCKERHUB_CI_TOKEN }}
      - name: Build container image
        run: buildah build -t iamcino/${{ github.event.repository.name }}:${{ github.sha }} .
      - name: Push container image
        run: buildah push iamcino/${{ github.event.repository.name }}:${{ github.sha }}
